name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  app:
    name: App checks (typecheck, lint, unit tests, build, contrast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/contrast.mjs
      # The browser tests (pnpm e2e) read real experiment folders (data_*), which are not in the repository; run them locally.

  setup-windows:
    name: New-user setup on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser installer (dry run)
        run: powershell -ExecutionPolicy Bypass -File scripts\install_browsers.ps1 -DryRun
      - name: Setup script
        run: powershell -ExecutionPolicy Bypass -File setup_windows.ps1
      - name: Doctor (Brave and LibreWolf are not preinstalled on the runner, so a non-zero exit is expected)
        continue-on-error: true
        run: .venv\Scripts\browserbench.exe doctor
      - name: Schedule
        run: .venv\Scripts\browserbench.exe schedule --suite core --repetitions 1

  setup-linux:
    name: New-user setup on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser installer (dry run)
        run: bash scripts/install_browsers.sh --dry-run
      - name: Setup script
        run: ./setup_linux.sh
      - name: Doctor (some browsers are not preinstalled, so a non-zero exit is expected)
        continue-on-error: true
        run: .venv/bin/browserbench doctor
      - name: Schedule
        run: .venv/bin/browserbench schedule --suite core --repetitions 1

  smoke-windows:
    name: Real smoke run on Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: powershell -ExecutionPolicy Bypass -File setup_windows.ps1
      - name: Try to install the missing browsers (best effort; the runner image decides what is preinstalled)
        continue-on-error: true
        run: .venv\Scripts\browserbench.exe setup --yes
      - name: Smoke config with only the browsers that are installed
        run: .venv\Scripts\python.exe tools\ci_smoke_config.py
      - run: .venv\Scripts\browserbench.exe --config config.ci.yaml run --suite core --repetitions 1
      - name: Every enabled browser must have produced a trial (a skipped trial still exits 0)
        shell: pwsh
        run: |
          $rows = @(Import-Csv data_ci\core\processed\trial_summary_core.csv)
          $rows | Select-Object browser, browser_version, mean_rss_mb | Format-Table
          $want = @(Select-String -Path config.ci.yaml -Pattern "enabled: true").Count
          if ($rows.Count -ne $want) { throw "expected $want trials, got $($rows.Count)" }
      - name: Quick mode once per workload (static, javascript, video) through the app's engine interface
        run: .venv\Scripts\python.exe tools\quick_all.py --browsers installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows-data
          path: data_ci

  app-windows:
    name: "Desktop app on Windows (x64) - build, launch, packaged Quick run"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: powershell -ExecutionPolicy Bypass -File setup_windows.ps1
      - name: Try to install the missing browsers (best effort)
        continue-on-error: true
        run: .venv\Scripts\browserbench.exe setup --yes
      - name: Build the app (frozen engine, then the Tauri installers)
        run: .venv\Scripts\python.exe scripts\build.py
      - name: Launch the built app and check its window opens
        shell: pwsh
        run: |
          $p = Start-Process app\src-tauri\target\release\browserlab.exe -PassThru
          Start-Sleep 20
          $p.Refresh()
          Get-Process browserlab* | Select-Object Name, Id, MainWindowTitle | Format-Table
          if ($p.HasExited) { throw "the app exited right after launch" }
          if (-not (Get-Process browserlab-engine -ErrorAction SilentlyContinue)) { throw "the bundled engine did not start" }
          Stop-Process -Id $p.Id -Force
          Get-Process browserlab-engine -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Packaged engine, Quick mode (profiles, then a real run)
        run: .venv\Scripts\python.exe tools\packaged_check.py app\src-tauri\target\release\engine\browserlab-engine\browserlab-engine.exe --workload video
      - uses: actions/upload-artifact@v4
        with:
          name: browserlab-windows-x64-installers
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe

  app-linux:
    name: "Desktop app on Linux (x64) - build, launch, packaged Quick run"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tauri system libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb ffmpeg
      - run: ./setup_linux.sh
      - name: Try to install the missing browsers (best effort)
        continue-on-error: true
        run: .venv/bin/browserbench setup --yes
      - name: Build the app (frozen engine, then the Tauri bundles)
        run: .venv/bin/python scripts/build.py
      - name: Install the built .deb the way a user would
        run: |
          sudo apt-get install -y ./app/src-tauri/target/release/bundle/deb/*.deb
          PKG=$(dpkg-deb -f app/src-tauri/target/release/bundle/deb/*.deb Package)
          echo "package: $PKG"; dpkg -L "$PKG" | grep -E "bin/|browserlab-engine$"
          echo "ENGINE=$(dpkg -L "$PKG" | grep -E 'browserlab-engine/browserlab-engine$' | head -1)" >> "$GITHUB_ENV"
          echo "APP=$(dpkg -L "$PKG" | grep -E '/bin/' | head -1)" >> "$GITHUB_ENV"
      - name: Packaged engine, Quick mode (profiles, then a real run)
        run: xvfb-run -a .venv/bin/python tools/packaged_check.py "$ENGINE" --workload video
      - name: Launch the installed app and check it stays up and starts its engine
        run: |
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            "$APP" > "$RUNNER_TEMP/app.log" 2>&1 & pid=$!
            for i in $(seq 1 40); do
              sleep 2
              kill -0 $pid 2>/dev/null || { echo "the app exited right after launch"; cat "$RUNNER_TEMP/app.log"; exit 1; }
              pgrep -f "[b]rowserlab-engine" >/dev/null && { echo "engine started after $((i*2))s"; kill $pid; pkill -f "[b]rowserlab-engine" || true; exit 0; }
            done
            echo "the bundled engine did not start in 80s; app output:"; cat "$RUNNER_TEMP/app.log"; ps aux | grep -i -E "browserlab|WebKit" | grep -v grep | head
            kill $pid; exit 1
          '
      - uses: actions/upload-artifact@v4
        with:
          name: browserlab-linux-x64-bundles
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/rpm/*.rpm
