[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-research-suite"
version = "0.1.1"
description = "Controlled browser resource-efficiency research harness for macOS Apple Silicon"
requires-python = ">=3.11"
dependencies = [
  "selenium>=4.27",
  "psutil>=6.1",
  "PyYAML>=6.0.2",
  "pandas>=2.2",
  "numpy>=2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
browserbench = "browserbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browserlab = ["protocol_base.yaml"]
